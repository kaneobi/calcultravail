<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:900px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 40px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:29px;margin:0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.muted{color:#777;font-size:13px}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;background:#dddde2;padding:4px;border-radius:14px;margin-bottom:14px}nav button{border:0;background:transparent;padding:9px 3px;border-radius:11px;font-size:12px}nav button.active{background:#fff;font-weight:700}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #0001}label{display:block;font-size:12px;color:#666;margin-bottom:5px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:650;background:#111;color:#fff}.btn.light{background:#e9e9ee;color:#111}.btn.red{background:#ffe6e6;color:#b00020}.btn.green{background:#e7f7ed;color:#17663a}.btn.blue{background:#e8f0ff;color:#174ea6}.actions{display:flex;gap:8px;flex-wrap:wrap}.work{border:1px solid #e5e5e8;border-radius:14px;padding:11px;margin-bottom:10px;background:#fafafd}.workhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.worktitle{font-weight:750}.grid4{display:grid;grid-template-columns:1.35fr 1.55fr .65fr .85fr 38px;gap:7px;align-items:end}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.total{text-align:right;font-size:27px;font-weight:800;margin-top:12px}.total small{font-size:13px;color:#777;font-weight:500}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.big{font-size:18px;font-weight:750}.money{font-weight:750;white-space:nowrap}.empty{text-align:center;padding:20px;color:#777}.badge{display:inline-block;padding:4px 8px;border-radius:9px;background:#eee;font-size:11px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f7f7fa;border-radius:14px;padding:13px}.stat .value{font-size:21px;font-weight:800;margin-top:4px}.site-total{display:flex;justify-content:space-between;padding:8px 0;font-weight:650}.credit{background:#fff4e5;border-radius:12px;padding:10px;margin-top:7px}.modalbg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:20px;padding:20px;width:min(430px,100%);box-shadow:0 12px 40px #0004}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:12px;z-index:30}.login{min-height:80vh;display:flex;align-items:center;justify-content:center}.login .card{width:min(430px,100%)}.topuser{display:flex;align-items:center;gap:8px}.spinner{text-align:center;padding:40px}.danger-note{background:#fff0f0;border-radius:12px;padding:11px;color:#8a0000;font-size:13px}@media(max-width:700px){.grid4{grid-template-columns:1fr 1fr}.grid4>div:nth-child(5){grid-column:2}.grid2{grid-template-columns:1fr}.app{padding-left:10px;padding-right:10px}nav button{font-size:11px}}

/* Menus déroulants avec recherche intégrée */
.picker{position:relative;min-width:0}
.picker-trigger{width:100%;min-height:43px;padding:10px 34px 10px 11px;border:1px solid #ddd;border-radius:11px;background:#fff;color:#111;text-align:left;font-size:15px;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-trigger:after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#666}
.picker-trigger.placeholder{color:#777}
.picker-menu{display:none;position:absolute;z-index:15;top:calc(100% + 4px);left:0;right:0;min-width:230px;background:#fff;border:1px solid #d8d8de;border-radius:13px;padding:8px;box-shadow:0 8px 28px #0002}
.picker.open .picker-menu{display:block}
.picker-search{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;font-size:16px;margin-bottom:7px}
.picker-options{max-height:230px;overflow-y:auto;overscroll-behavior:contain}
.picker-option{display:block;width:100%;padding:10px;border:0;border-radius:8px;background:#fff;text-align:left;font-size:14px;color:#111}
.picker-option:hover,.picker-option:focus{background:#f0f0f5;outline:none}
.picker-option.selected{background:#e8f0ff;font-weight:700}
.picker-empty{padding:10px;color:#777;font-size:13px}
@media(max-width:700px){.picker-menu{min-width:0;width:max(100%,220px);max-width:calc(100vw - 40px)}.picker-options{max-height:200px}}

<body>
<div class="app">
<header><div><h1>Suivi Chantier</h1><div id="count" class="muted"></div></div><div id="userArea"></div></header>
<div id="app"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://pcbrifwucnmdkxvvqbit.supabase.co';
const SUPABASE_KEY='sb_publishable_l3pmSSFD60PGIH-Z_vBeeQ_sINP3lzo';
const {createClient}=supabase;
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
const LOCAL_KEY='suivi_chantier_v4';
let session=null, profile=null, isAdmin=false;
let sites=[], rates=[], credits=[], profiles=[];
let days={}, currentDate=new Date().toISOString().slice(0,10), currentPage='today', lines=[];
const SHARE_EMAILS_KEY='suivi_chantier_share_emails_v1';
function savedShareEmails(){try{const value=JSON.parse(localStorage.getItem(SHARE_EMAILS_KEY)||'[]');return Array.isArray(value)?value.filter(x=>typeof x==='string'):[]}catch{return []}}
let shareDate='',shareRecipient=savedShareEmails()[0]||'',shareSelected=[];
let undoStack=[];

function money(n){return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function dateFR(d){return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function monthFR(m){let [y,mo]=m.split('-');return new Date(Number(y),Number(mo)-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2600)}
function setCount(){let n=Object.keys(days).length;document.getElementById('count').textContent=n+' jour'+(n>1?'s':'')+(isAdmin?' · administrateur':'')}
function show(p){currentPage=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function closeModal(){document.getElementById('modal').innerHTML=''}

let booting=false;
async function bootstrap(sess){
  if(booting) return;
  booting=true;
  try{
    session=sess;
    if(!sess){profile=null;isAdmin=false;sites=[];rates=[];credits=[];days={};document.getElementById('userArea').innerHTML='';renderLogin();return;}
    await loadUser();
    if(!profile) return;
    await loadData();
    render();
  }finally{booting=false;}
}
async function init(){
 document.getElementById('app').innerHTML='<div class="spinner">Connexion à la base de données…</div>';
 sb.auth.onAuthStateChange((event,sess)=>{
   if(event==='SIGNED_IN'||event==='SIGNED_OUT'||event==='USER_UPDATED'||event==='INITIAL_SESSION') setTimeout(()=>bootstrap(sess),0);
 });
 const {data:{session:s},error}=await sb.auth.getSession();
 if(error){console.error(error);renderLogin();return;}
 await bootstrap(s);
}
async function loadUser(){
 const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(error){console.error(error);toast('Impossible de charger le profil');return}
 profile=data;isAdmin=data.role==='admin';
 document.getElementById('userArea').innerHTML=`<div class="topuser"><span class="badge">${isAdmin?'Admin':'Utilisateur'}</span><button class="btn light" style="padding:7px 9px" onclick="logout()">Déconnexion</button></div>`;
}
async function loadData(){
 const s=await sb.from('chantiers').select('*').eq('actif',true).order('nom');
 if(s.error){console.error(s.error);toast('Erreur chargement chantiers')}else sites=s.data||[];
 const r=await sb.from('taches').select('*').eq('actif',true).order('nom');
 if(r.error){console.error(r.error);toast('Erreur chargement tarifs')}else rates=r.data||[];
 const p=await sb.from('profiles').select('id,nom,role');
 if(p.error){console.error(p.error);profiles=[]}else profiles=p.data||[];
 const j=await sb.from('jours').select('*').order('date_travail',{ascending:false});
 if(j.error){console.error(j.error);toast('Erreur chargement journées');return}
 const raw=j.data||[]; const ids=raw.map(x=>x.id);
 let tr=[];
 if(ids.length){
   if(isAdmin){
     const q=await sb.from('travaux').select('*').in('jour_id',ids).order('created_at');
     if(q.error){console.error(q.error);toast('Erreur chargement travaux')}else tr=q.data||[];
   }else{
     const [pub,own]=await Promise.all([
       sb.from('travaux_historique').select('*').in('jour_id',ids).order('created_at'),
       sb.from('travaux').select('*').in('jour_id',ids).eq('user_id',session.user.id).order('created_at')
     ]);
     if(pub.error){console.error(pub.error);toast('Erreur chargement historique')}else tr=pub.data||[];
     if(!own.error){
       const byId=new Map((tr||[]).map(x=>[x.id,x]));
       (own.data||[]).forEach(x=>byId.set(x.id,x));
       tr=[...byId.values()];
     }
   }
 }
 days={};
 raw.forEach(d=>{days[d.date_travail]={id:d.id,date:d.date_travail,user_id:d.user_id,lines:[],total:0,created_at:d.created_at}});
 tr.forEach(x=>{const d=Object.values(days).find(y=>y.id===x.jour_id);if(!d)return;const l={id:x.id,siteId:x.chantier_id,site:(sites.find(s=>s.id===x.chantier_id)||{}).nom||'',rateId:x.tache_id,rate:'',name:x.tache_nom,unit:x.unite,qty:Number(x.quantite)||0,price:Number(x.prix_unitaire)||0,user_id:x.user_id,remarque:x.remarque||''};d.lines.push(l);d.total+=l.qty*l.price});
 if(isAdmin){const c=await sb.from('avoirs').select('*').order('created_at',{ascending:false});credits=c.data||[]}
 else credits=[];
 setCount();
}
function renderLogin(){document.getElementById('userArea').innerHTML='';document.getElementById('app').innerHTML=`<div class="login"><div class="card"><h2>🔐 Connexion</h2><div class="muted" style="margin-bottom:14px">Connecte-toi à ton espace Suivi Chantier.</div><label>Identifiant</label><input id="loginEmail" autocomplete="username" placeholder="ton prénom"><div style="height:10px"></div><label>Mot de passe</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Mot de passe"><button class="btn" style="margin-top:14px;width:100%" onclick="login()">Se connecter</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></div></div>`}
async function login(){let ident=document.getElementById('loginEmail').value.trim().toLowerCase(),pass=document.getElementById('loginPass').value;const m=document.getElementById('loginMsg');m.textContent='Connexion…';const email=ident.includes('@')?ident:(ident+'@calcultravail.local');const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)m.textContent='Connexion impossible : '+error.message}
async function logout(){await sb.auth.signOut()}

function render(){if(!session)return renderLogin();setCount();if(currentPage==='today')renderToday();if(currentPage==='history')renderHistory();if(currentPage==='share')renderShare();if(currentPage==='rates')renderRates();if(currentPage==='sites')renderSites();if(currentPage==='search')renderSearch();if(currentPage==='users')renderUsers()}
function nav(){return `<nav><button data-page="today" onclick="show('today')">Aujourd’hui</button><button data-page="history" onclick="show('history')">Historique</button><button data-page="share" onclick="show('share')">Partager</button>${isAdmin?'<button data-page="rates" onclick="show(\'rates\')">🔒 Tarifs</button><button data-page="sites" onclick="show(\'sites\')">🔒 Chantiers</button>':'<button disabled style="opacity:.45">🔒 Tarifs</button><button disabled style="opacity:.45">🔒 Chantiers</button>'}<button data-page="search" onclick="show('search')">🔎 Recherche</button>${isAdmin?'<button data-page="users" onclick="show(\'users\')">👥 Utilisateurs</button>':''}</nav>`}
function renderToday(){
 const day=days[currentDate]; if(day&&!lines.length&&(isAdmin||day.lines.every(l=>l.user_id===session.user.id)))lines=day.lines.map(x=>({...x}));
 const editingExisting=!isAdmin && !!day && lines.length>0;
 document.getElementById('app').innerHTML=nav()+`<main><div class="card"><h2>Journée</h2><label>Date</label><input type="date" value="${currentDate}" ${editingExisting?'disabled':''} onchange="changeDate(this.value)"><div class="muted" style="margin-top:10px">Plusieurs chantiers et plusieurs tâches sont possibles dans la même journée.${editingExisting?' Tu modifies uniquement tes propres lignes.':''}</div></div><div class="card"><h2>Travaux réalisés</h2><div id="lines"></div><button class="btn light" onclick="addLine()">＋ Ajouter une tâche / chantier</button>${isAdmin?'<div class="total"><small>Total journée</small><br><span id="total">0,00 €</span></div>':''}<div class="actions" style="margin-top:13px"><button class="btn" onclick="saveDay()">Enregistrer la journée</button>${isAdmin||!day||day.lines.every(l=>l.user_id===session.user.id)?'<button class="btn red" onclick="clearDay()">Effacer</button>':''}</div></div></main>`;renderLines();calc()}
function changeDate(v){currentDate=v;lines=days[v]?days[v].lines.map(x=>({...x})):[];renderToday()}
function addLine(){lines.push({siteId:'',site:'',rateId:'',name:'',unit:'',qty:'',price:'',remarque:''});renderLines();calc()}
function renderLines(){
  const box=document.getElementById('lines');if(!box)return;
  if(!lines.length){box.innerHTML='<div class="empty">Aucune tâche. Ajoute une ligne.</div>';return}
  box.innerHTML=lines.map((l,i)=>{
    const siteName=sites.find(s=>s.id===l.siteId)?.nom||l.site||'';
    const rateName=rates.find(r=>r.id===l.rateId)?.nom||l.name||'';
    const siteOptions=sites.map(s=>`<button type="button" class="picker-option ${s.id===l.siteId?'selected':''}" data-value="${s.id}" onclick="chooseSite(${i},'${s.id}')">${esc(s.nom)}</button>`).join('');
    const rateOptions=rates.map(r=>`<button type="button" class="picker-option ${r.id===l.rateId?'selected':''}" data-value="${r.id}" onclick="chooseRate(${i},'${r.id}')">${esc(r.nom)}${isAdmin?' — '+money(r.prix)+'/'+esc(r.unite):' — '+esc(r.unite)}</button>`).join('');
    return `<div class="work"><div class="workhead"><span class="worktitle">Travail ${i+1}</span><button class="btn red" style="padding:6px 10px" onclick="deleteLine(${i})">Supprimer</button></div>
      <div class="grid4" style="${isAdmin?'':'grid-template-columns:1.35fr 1.55fr .65fr 38px'}">
        <div><label>Chantier</label><div class="picker" id="sitePicker${i}">
          <button type="button" class="picker-trigger ${siteName?'':'placeholder'}" onclick="togglePicker('site',${i})">${esc(siteName||'Choisir…')}</button>
          <div class="picker-menu"><input class="picker-search" type="search" placeholder="Rechercher un chantier…" aria-label="Rechercher un chantier" oninput="filterPicker(this)" onclick="event.stopPropagation()"><div class="picker-options">${siteOptions||'<div class="picker-empty">Aucun chantier disponible.</div>'}</div></div>
        </div></div>
        <div><label>Tâche</label><div class="picker" id="ratePicker${i}">
          <button type="button" class="picker-trigger ${rateName?'':'placeholder'}" onclick="togglePicker('rate',${i})">${esc(rateName||'Choisir…')}</button>
          <div class="picker-menu"><input class="picker-search" type="search" placeholder="Rechercher une tâche…" aria-label="Rechercher une tâche" oninput="filterPicker(this)" onclick="event.stopPropagation()"><div class="picker-options">${rateOptions||'<div class="picker-empty">Aucune tâche disponible.</div>'}</div></div>
        </div></div>
        <div><label>Quantité</label><input type="number" inputmode="decimal" step="0.01" value="${esc(l.qty)}" oninput="lines[${i}].qty=this.value;calc()"></div>
        ${isAdmin?`<div><label>Prix</label><input type="number" inputmode="decimal" step="0.01" value="${esc(l.price)}" oninput="lines[${i}].price=this.value;calc()"></div>`:''}
        <div><button class="btn red" style="padding:10px 8px" onclick="deleteLine(${i})">×</button></div>
      </div>
      <div class="muted" style="margin-top:6px">${l.unit?'Unité : '+esc(l.unit):'Sélectionne une tâche.'}</div>
      <div style="margin-top:8px"><label>Remarque (facultatif)</label><input type="text" value="${esc(l.remarque||'')}" placeholder="Ex. finition, difficulté, précision…" oninput="lines[${i}].remarque=this.value"></div>
    </div>`;
  }).join('');
}
function togglePicker(kind,i){
  const id=(kind==='site'?'sitePicker':'ratePicker')+i;
  const target=document.getElementById(id);
  const wasOpen=target?.classList.contains('open');
  document.querySelectorAll('.picker.open').forEach(p=>p.classList.remove('open'));
  if(target&&!wasOpen){
    target.classList.add('open');
    const input=target.querySelector('.picker-search');
    if(input){input.value='';filterPicker(input);input.focus({preventScroll:true});}
  }
}
function filterPicker(input){
  const q=input.value.trim().toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const options=input.parentElement.querySelectorAll('.picker-option');
  let visible=0;
  options.forEach(o=>{
    const text=o.textContent.toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const show=!q||text.includes(q);
    o.style.display=show?'block':'none';
    if(show)visible++;
  });
  let empty=input.parentElement.querySelector('.picker-no-match');
  if(!empty){empty=document.createElement('div');empty.className='picker-empty picker-no-match';empty.textContent='Aucun résultat';input.parentElement.querySelector('.picker-options').appendChild(empty);}
  empty.style.display=visible?'none':'block';
}
function chooseSite(i,id){
  const s=sites.find(x=>x.id===id);if(!s)return;
  lines[i].siteId=s.id;lines[i].site=s.nom;
  renderLines();calc();
}
function chooseRate(i,id){pickRate(i,id)}
document.addEventListener('click',e=>{
  if(!e.target.closest('.picker'))document.querySelectorAll('.picker.open').forEach(p=>p.classList.remove('open'));
});
function pickRate(i,v){lines[i].rateId=v;if(v){const r=rates.find(x=>x.id===v);if(r){lines[i].name=r.nom;lines[i].unit=r.unite;lines[i].price=r.prix}}else{lines[i].name='';lines[i].unit='';lines[i].price=''}renderLines();calc()}
function deleteLine(i){undoStack.push({type:'line',index:i,data:{...lines[i]},date:currentDate});lines.splice(i,1);renderLines();calc();toast('Tâche supprimée — annulation disponible dans Historique')}
function calc(){let t=lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0);let e=document.getElementById('total');if(e)e.textContent=money(t);return t}
async function saveDay(){
 const clean=lines.filter(l=>l.siteId||l.name||Number(l.qty)||Number(l.price));
 if(clean.some(l=>!l.siteId||!l.name)){toast('Chaque ligne doit avoir un chantier et une tâche');return}
 let day=days[currentDate];
 let dayId=day?.id;
 if(!dayId){
   const q=await sb.from('jours').insert({date_travail:currentDate,user_id:session.user.id}).select().single();
   if(q.error){toast('Erreur création journée : '+q.error.message);return}
   dayId=q.data.id;
 }
 if(isAdmin){
   const oldIds=day?.lines.filter(x=>x.id).map(x=>x.id)||[];
   if(oldIds.length){const qd=await sb.from('travaux').delete().in('id',oldIds);if(qd.error){toast('Erreur suppression des anciennes lignes : '+qd.error.message);return}}
 }else{
   const ownOldIds=day?.lines.filter(x=>x.id&&x.user_id===session.user.id).map(x=>x.id)||[];
   if(ownOldIds.length){const qd=await sb.from('travaux').delete().in('id',ownOldIds);if(qd.error){toast('Erreur modification de tes lignes : '+qd.error.message);return}}
 }
 const payload=clean.map(l=>({jour_id:dayId,chantier_id:l.siteId,tache_id:l.rateId||null,tache_nom:l.name,unite:l.unit||'',quantite:Number(l.qty)||0,prix_unitaire:Number(l.price)||0,remarque:(l.remarque||'').trim()||null,user_id:isAdmin?(l.user_id||session.user.id):session.user.id}));
 if(payload.length){const q=await sb.from('travaux').insert(payload);if(q.error){toast('Erreur enregistrement : '+q.error.message);return}}
 if(isAdmin){
   const uq=await sb.from('jours').update({updated_at:new Date().toISOString()}).eq('id',dayId);
   if(uq.error){toast('Journée enregistrée, mais la date n’a pas été mise à jour : '+uq.error.message)}
 }
 await loadData();
 lines=days[currentDate]?(isAdmin?days[currentDate].lines:days[currentDate].lines.filter(x=>x.user_id===session.user.id)).map(x=>({...x})) : [];
 toast('Journée enregistrée');renderToday()
}
async function clearDay(){const d=days[currentDate];if(!d){toast('Aucune journée enregistrée');return}if(!confirm('Effacer toute cette journée ?'))return;const q=await sb.from('jours').delete().eq('id',d.id);if(q.error){toast('Impossible de supprimer : '+q.error.message);return}undoStack.push({type:'day',date:currentDate,data:d});await loadData();lines=[];renderToday();toast('Journée supprimée — annulation possible tant que la page reste ouverte')}

function monthlyTotals(){const out={};Object.entries(days).forEach(([d,x])=>{const m=d.slice(0,7);out[m]=(out[m]||0)+x.total});return out}
function userName(userId){
  const p=profiles.find(x=>x.id===userId);
  return p?.nom||'';
}
function renderHistory(){
  const dates=Object.keys(days).sort().reverse();
  let html=nav()+'<main>';
  if(undoStack.length){
    html+='<div class="card"><h2>↶ Annuler une suppression</h2><button class="btn green" onclick="undoLast()">↶ Annuler la dernière suppression</button><div class="muted" style="margin-top:7px">Dernière suppression : '+(undoStack[undoStack.length-1].type==='day'?'journée':'tâche')+'</div></div>';
  }
  html+='<div class="card"><h2>💾 Sauvegarde locale</h2><div class="muted" style="margin-bottom:10px">Cette sauvegarde permet aussi de conserver une copie de sécurité de tes données.</div><div class="actions"><button class="btn" title="Exporter les données" aria-label="Exporter les données" onclick="exportData()">⬇️</button><button class="btn light" title="Importer une sauvegarde" aria-label="Importer une sauvegarde" onclick="document.getElementById(\'importFile\').click()">⬆️</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div></div>';
  if(isAdmin){
    html+='<details style="margin:4px 0 12px;padding:8px 10px;background:#ffffff80;border-radius:12px"><summary style="cursor:pointer;font-size:13px;color:#777">⚙️ Migration ancienne application</summary><div class="muted" style="margin-top:9px">Pour importer une ancienne sauvegarde JSON de la version locale dans Supabase.</div><div class="muted" style="margin-top:6px">À faire une seule fois. Ne pas importer plusieurs fois le même fichier.</div><button class="btn light" style="margin-top:9px;padding:8px 10px;font-size:13px" onclick="document.getElementById(\'migrationFile\').click()">📥 Choisir le fichier</button><input id="migrationFile" type="file" accept=".json,application/json" style="display:none" onchange="migrateOldData(this)"></details>';
  }
  html+='<div class="card"><h2>Journées</h2>';
  if(!dates.length){html+='<div class="empty">Aucune journée enregistrée.</div>'}
  else{
    // Regroupement Année → Mois → Journées
    const years={};
    dates.forEach(d=>{
      const y=d.slice(0,4), m=d.slice(0,7);
      if(!years[y]) years[y]={};
      if(!years[y][m]) years[y][m]=[];
      years[y][m].push(d);
    });
    Object.keys(years).sort().reverse().forEach(y=>{
      const months=years[y];
      const yearDates=Object.values(months).flat();
      const yearTotal=yearDates.reduce((a,d)=>a+(Number(days[d].total)||0),0);
      const yearId='hist-y-'+y;
      html+='<details class="history-year" open style="margin-bottom:12px"><summary style="cursor:pointer;padding:10px 4px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;gap:10px"><span>📅 '+y+' <span class="muted" style="font-size:14px;font-weight:500">— '+yearDates.length+' journée(s)</span></span>'+(isAdmin?'<span class="money">'+money(yearTotal)+'</span>':'')+'</summary>';
      Object.keys(months).sort().reverse().forEach(m=>{
        const md=months[m];
        const monthTotal=md.reduce((a,d)=>a+(Number(days[d].total)||0),0);
        const monthLabel=new Intl.DateTimeFormat('fr-FR',{month:'long'}).format(new Date(m+'-01T12:00:00'));
        html+='<details class="history-month" style="margin:6px 0 8px 10px"><summary style="cursor:pointer;padding:8px 6px;background:#f7f7f7;border-radius:8px;display:flex;justify-content:space-between;gap:10px"><span style="text-transform:capitalize">'+esc(monthLabel)+' <span class="muted">— '+md.length+' journée(s)</span></span>'+(isAdmin?'<span class="money">'+money(monthTotal)+'</span>':'')+'</summary>';
        md.forEach(d=>{
          const bySite={};
          days[d].lines.forEach(l=>bySite[l.site||'Sans chantier']=(bySite[l.site||'Sans chantier']||0)+l.qty*l.price);
          html+='<div style="padding:10px 6px 10px 10px;border-bottom:1px solid #eee"><div class="item">';
          html+='<div><div class="big">'+dateFR(d)+'</div><div class="muted">'+Object.keys(bySite).length+' chantier(s) · '+days[d].lines.length+' tâche(s)'+'</div></div>';
          html+='<div style="text-align:right">'+(isAdmin?'<div class="money">'+money(days[d].total)+'</div>':'')+'<div class="actions" style="justify-content:flex-end;margin-top:6px"><button class="btn light" style="padding:7px 9px" onclick="viewDay(\''+d+'\')">Voir</button>'+(isAdmin||canEditDay(d)?'<button class="btn light" style="padding:7px 9px" onclick="editDay(\''+d+'\')">Modifier</button>':'')+'</div></div></div>';
          Object.entries(bySite).forEach(([site,total])=>{
            const siteLines=days[d].lines.filter(l=>(l.site||'Sans chantier')===site);
            const workerIds=[...new Set(siteLines.map(l=>l.user_id).filter(Boolean))];
            const workerNames=workerIds.map(id=>userName(id)).filter(Boolean);
            const workerLabel=workerNames.length?'<span class="history-worker">('+workerNames.map(esc).join(', ')+')</span>':'';
            html+='<div class="site-total"><span>🏗️ '+esc(site)+' '+workerLabel+'</span>'+(isAdmin?'<span>'+money(total)+'</span>':'')+'</div>';
          });
          html+='</div>';
        });
        html+='</details>';
      });
      html+='</details>';
    });
  }
  html+='</div></main>';
  document.getElementById('app').innerHTML=html;
}
function canEditDay(d){const day=days[d];if(!day)return false;return isAdmin||day.lines.some(l=>l.user_id===session.user.id)}
function renderShare(){
  const dates=Object.keys(days).sort().reverse();
  if(!shareDate||!days[shareDate])shareDate=dates[0]||'';
  document.getElementById('app').innerHTML=nav()+`<main><div class="card"><h2>✉️ Partager une journée</h2><div class="muted" style="margin-bottom:12px">Choisis une journée, sélectionne les chantiers à transmettre et indique l’adresse courriel du destinataire.</div><label>Journée de l’historique</label><select id="shareDate" onchange="changeShareDate(this.value)"><option value="">Choisir une journée…</option>${dates.map(d=>`<option value="${d}" ${d===shareDate?'selected':''}>${dateFR(d)}</option>`).join('')}</select><div id="shareSites" style="margin-top:14px">${shareSitesHtml()}</div><div style="margin-top:14px"><label>Adresse courriel du destinataire</label><input id="shareRecipient" type="email" list="shareEmailSuggestions" autocomplete="email" placeholder="nom@exemple.fr" value="${esc(shareRecipient)}" oninput="shareRecipient=this.value"><datalist id="shareEmailSuggestions">${savedShareEmails().map(email=>`<option value="${esc(email)}"></option>`).join('')}</datalist>${savedShareEmails().length?'<div class="muted" style="margin-top:5px">Adresses mémorisées sur cet appareil; la dernière utilisée est préremplie.</div>':''}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="sendShareEmail()">Préparer le courriel</button></div><div class="muted" style="margin-top:9px">Ton application de messagerie s’ouvrira avec le contenu prérempli. Vérifie le message puis appuie sur Envoyer.</div></div><div id="sharePreview">${sharePreviewHtml()}</div></main>`;
}
function sharePreviewHtml(){
  const day=days[shareDate];
  if(!day)return '<div class="card"><h2>Aperçu du courriel</h2><div class="empty">Choisis une journée pour afficher l’aperçu.</div></div>';
  const selected=day.lines.filter(l=>shareSelected.includes(l.site||'Sans chantier'));
  if(!selected.length)return '<div class="card"><h2>👁️ Aperçu du courriel</h2><div class="empty">Coche au moins un chantier pour afficher le compte rendu.</div></div>';
  const groups={};selected.forEach(l=>{const name=l.site||'Sans chantier';(groups[name]||(groups[name]=[])).push(l)});
  let html=`<div class="card"><h2>👁️ Aperçu du courriel</h2><div class="muted">Objet : Compte rendu chantier — ${esc(new Date(shareDate+'T12:00:00').toLocaleDateString('fr-FR'))}</div><div style="margin-top:14px">Bonjour,<br><br>Voici le compte rendu du ${esc(dateFR(shareDate))} :</div>`;
  Object.entries(groups).forEach(([site,items])=>{html+=`<div style="margin-top:16px"><h3>🏗️ ${esc(site)}</h3>`;items.forEach(l=>{const amount=(Number(l.qty)||0)*(Number(l.price)||0);html+=`<div class="work"><div class="worktitle">${esc(l.name||'Tâche libre')}</div><div class="muted" style="margin-top:5px">Quantité : <b>${esc(l.qty)}</b> ${esc(l.unit||'')}${isAdmin?' · Montant : '+money(amount):''}</div>${l.remarque?`<div style="margin-top:7px"><b>Remarque :</b> ${esc(l.remarque)}</div>`:''}</div>`});html+='</div>'});
  if(isAdmin){const total=selected.reduce((sum,l)=>sum+(Number(l.qty)||0)*(Number(l.price)||0),0);html+=`<div class="total"><small>Total sélectionné</small><br>${money(total)}</div>`}
  html+='<div style="margin-top:15px">Cordialement,<br>Martin</div></div>';return html;
}
function shareSitesHtml(){
  const day=days[shareDate];
  if(!day)return '<div class="empty">Aucune journée enregistrée à partager.</div>';
  const names=[...new Set(day.lines.map(l=>l.site||'Sans chantier'))];
  if(!names.length)return '<div class="empty">Cette journée ne contient aucun chantier.</div>';
  return '<div><div class="big" style="font-size:15px;margin-bottom:8px">Chantiers à inclure</div>'+names.map((name,i)=>`<label style="display:flex;align-items:center;gap:9px;padding:9px 10px;margin:0;border:1px solid #eee;border-radius:10px;margin-bottom:7px;color:#111;font-size:14px"><input type="checkbox" style="width:20px;height:20px;margin:0" ${shareSelected.includes(name)?'checked':''} onchange="toggleShareSite(${i},this.checked)"><span>🏗️ ${esc(name)}</span></label>`).join('')+'</div>';
}
function changeShareDate(date){shareDate=date;shareSelected=[];renderShare()}
function toggleShareSite(index,checked){const names=[...new Set((days[shareDate]?.lines||[]).map(l=>l.site||'Sans chantier'))],name=names[index];if(!name)return;if(checked&&!shareSelected.includes(name))shareSelected.push(name);if(!checked)shareSelected=shareSelected.filter(x=>x!==name);const box=document.getElementById('shareSites');if(box)box.innerHTML=shareSitesHtml();const preview=document.getElementById('sharePreview');if(preview)preview.innerHTML=sharePreviewHtml()}
function sendShareEmail(){
  const input=document.getElementById('shareRecipient');if(input)shareRecipient=input.value.trim();
  if(!shareDate||!days[shareDate]){toast('Choisis une journée à partager.');return}
  if(!shareRecipient||!/^\S+@\S+\.\S+$/.test(shareRecipient)){toast('Renseigne une adresse courriel valide.');return}
  if(!shareSelected.length){toast('Sélectionne au moins un chantier.');return}
  try{const emails=[shareRecipient,...savedShareEmails().filter(email=>email.toLowerCase()!==shareRecipient.toLowerCase())].slice(0,20);localStorage.setItem(SHARE_EMAILS_KEY,JSON.stringify(emails))}catch{toast('Impossible de mémoriser cette adresse sur cet appareil.')}
  const day=days[shareDate],selected=day.lines.filter(l=>shareSelected.includes(l.site||'Sans chantier'));
  const bySite={};selected.forEach(l=>{const name=l.site||'Sans chantier';(bySite[name]||(bySite[name]=[])).push(l)});
  const body=['Bonjour,','',`Voici le compte rendu du ${dateFR(shareDate)} :`,''];
  Object.entries(bySite).forEach(([site,items])=>{body.push(`CHANTIER : ${site}`);items.forEach(l=>{let line=`• ${l.name||'Tâche libre'} — ${l.qty} ${l.unit||''}`.trim();if(l.remarque)line+=`\n  Remarque : ${l.remarque}`;if(isAdmin)line+=`\n  Montant : ${money((Number(l.qty)||0)*(Number(l.price)||0))}`;body.push(line)});body.push('')});
  if(isAdmin){const total=selected.reduce((sum,l)=>sum+(Number(l.qty)||0)*(Number(l.price)||0),0);body.push(`Total sélectionné : ${money(total)}`,'')}
  body.push('Cordialement,','Martin');
  const subject=`Compte rendu chantier — ${new Date(shareDate+'T12:00:00').toLocaleDateString('fr-FR')}`;
  window.location.href=`mailto:${encodeURIComponent(shareRecipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body.join('\n'))}`;
}
function editDay(d){const day=days[d];if(!day)return;if(!canEditDay(d)){toast('Tu n’as aucune ligne modifiable dans cette journée');return}currentDate=d;lines=isAdmin?day.lines.map(x=>({...x})):day.lines.filter(x=>x.user_id===session.user.id).map(x=>({...x}));show('today')}
function viewDay(d){
  const day=days[d];
  if(!day){toast('Journée introuvable');return}
  const bySite={};
  day.lines.forEach(l=>{const k=l.site||'Sans chantier';if(!bySite[k])bySite[k]=[];bySite[k].push(l)});
  let html='<div class=\"modalbg\"><div class=\"modal\" style=\"width:min(700px,100%);max-height:90vh;overflow:auto\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div><h2 style=\"margin:0 0 4px\">Journée du '+dateFR(d)+'</h2><div class=\"muted\">Consultation seule</div></div><button class=\"btn light\" onclick=\"closeModal()\">Fermer</button></div>';
  Object.entries(bySite).forEach(([site,arr])=>{
    html+='<div style=\"margin-top:16px\"><h3>🏗️ '+esc(site)+'</h3>';
    arr.forEach(l=>{
      const lineTotal=(Number(l.qty)||0)*(Number(l.price)||0);
      html+='<div class=\"work\"><div class=\"workhead\"><div class=\"worktitle\">'+esc(l.name||'Tâche libre')+'</div>'+(isAdmin?'<div class=\"money\">'+money(lineTotal)+'</div>':'')+'</div>';
      html+='<div class=\"muted\">Quantité : <b>'+esc(l.qty)+'</b> '+esc(l.unit||'')+(isAdmin?' · Prix : '+money(l.price)+' / '+esc(l.unit||''):'')+'</div>'+(l.remarque?'<div style=\"margin-top:7px\"><b>Remarque :</b> '+esc(l.remarque)+'</div>':'')+'</div>';
    });
    html+='</div>';
  });
  if(isAdmin)html+='<div class=\"total\"><small>Total journée</small><br>'+money(day.total)+'</div>';
  html+='</div></div>';
  document.getElementById('modal').innerHTML=html;
}
async function undoLast(){const a=undoStack.pop();if(!a){toast('Rien à annuler');return}if(a.type==='line'){lines.splice(Math.min(a.index,lines.length),0,a.data);toast('Tâche remise dans le formulaire — pense à enregistrer la journée')}else{if(!days[a.date]){currentDate=a.date;lines=a.data.lines.map(x=>({...x}));toast('Journée restaurée dans le formulaire — pense à enregistrer');show('today');return}}render()}

function renderRates(){const months=monthlyTotals(),ms=Object.keys(months).sort().reverse();const monthlyHtml=ms.length?`<div class="statgrid">${ms.map(m=>`<div class="stat"><div class="muted">${monthFR(m)}</div><div class="value">${money(months[m])}</div></div>`).join('')}</div>`:'<div class="empty">Aucune donnée.</div>';const grand=Object.values(months).reduce((s,v)=>s+v,0);document.getElementById('app').innerHTML=nav()+`<main><div class="card"><h2>🔒 Tarifs & résultats</h2><div class="muted">Accès administrateur</div></div><div class="card"><h2>📊 Totaux mensuels</h2>${monthlyHtml}<div style="margin-top:12px;padding-top:12px;border-top:1px solid #eee"><div class="muted">Total cumulé</div><div class="big">${money(grand)}</div></div></div><div class="card"><h2>Ajouter une tâche et son tarif</h2><label>Nom de la tâche</label><input id="rn" placeholder="Ex. Enduit monocouche"><div style="height:9px"></div><div class="grid2"><div><label>Unité</label><input id="ru" placeholder="m², ml, m³…"></div><div><label>Prix unitaire (€)</label><input id="rp" type="number" step="0.01" placeholder="14"></div></div><button class="btn" style="margin-top:10px" onclick="addRate()">Ajouter au menu</button></div><div class="card"><h2>Mes tâches disponibles</h2>${rates.length?rates.map(r=>`<div class="item"><div><div class="big">${esc(r.nom)}</div><div class="muted">${money(r.prix)} / ${esc(r.unite)}</div></div><button class="btn red" onclick="deleteRate('${r.id}')">×</button></div>`).join(''):'<div class="empty">Aucune tâche enregistrée.</div>'}</div>${isAdmin?creditsHtml():''}</main>`}
async function addRate(){const n=document.getElementById('rn').value.trim(),u=document.getElementById('ru').value.trim(),p=Number(document.getElementById('rp').value);if(!n||!u||p<=0){toast('Renseigne la tâche, l’unité et le prix.');return}const q=await sb.from('taches').insert({nom:n,unite:u,prix:p,created_by:session.user.id}).select().single();if(q.error){toast('Erreur : '+q.error.message);return}await loadData();renderRates();toast('Tâche ajoutée')}
async function deleteRate(id){if(!confirm('Désactiver cette tâche ? Elle ne sera plus proposée pour les nouvelles saisies.'))return;const q=await sb.from('taches').update({actif:false}).eq('id',id);if(q.error)toast('Erreur : '+q.error.message);else{await loadData();renderRates()}}
function creditsHtml(){const total=credits.reduce((s,c)=>s+Number(c.montant||0),0);return `<div class="card"><h2>💶 Avoirs</h2><div class="muted">Total des avoirs enregistrés : <b>${money(total)}</b></div><div class="grid2" style="margin-top:10px"><div><label>Chantier</label><select id="creditSite"><option value="">Choisir…</option>${sites.map(s=>`<option value="${s.id}">${esc(s.nom)}</option>`).join('')}</select></div><div><label>Montant (€)</label><input id="creditAmount" type="number" step="0.01"></div></div><label style="margin-top:9px">Commentaire</label><input id="creditComment" placeholder="Ex. reprise, remise, erreur…"><button class="btn" style="margin-top:10px" onclick="addCredit()">Ajouter l’avoir</button>${credits.map(c=>`<div class="credit"><b>${esc((sites.find(s=>s.id===c.chantier_id)||{}).nom||'Chantier')}</b> — ${money(c.montant)}<div class="muted">${esc(c.commentaire||'')}</div></div>`).join('')}</div>`}
async function addCredit(){const sid=document.getElementById('creditSite').value,amount=Number(document.getElementById('creditAmount').value),comment=document.getElementById('creditComment').value.trim();if(!sid||amount<=0){toast('Choisis un chantier et un montant.');return}const q=await sb.from('avoirs').insert({chantier_id:sid,montant:amount,commentaire:comment,user_id:session.user.id});if(q.error)toast('Erreur : '+q.error.message);else{await loadData();renderRates();toast('Avoir ajouté')}}

function renderSites(){document.getElementById('app').innerHTML=nav()+`<main><div class="card"><h2>🔒 Chantiers</h2><div class="muted">Accès administrateur</div></div><div class="card"><h2>Ajouter un chantier</h2><label>Nom du chantier</label><input id="sn" placeholder="Ex. Chantier Prades"><button class="btn" style="margin-top:10px" onclick="addSite()">Ajouter au menu</button></div><div class="card"><h2>Chantiers disponibles</h2>${sites.length?sites.map(s=>`<div class="item"><div><div class="big">🏗️ ${esc(s.nom)}</div><div class="muted">Modifier le nom sans supprimer les journées associées.</div></div><div style="display:flex;gap:6px;align-items:center"><button class="btn" title="Renommer le chantier" aria-label="Renommer le chantier" style="padding:9px 11px" onclick="renameSite('${s.id}')">✏️</button><button class="btn red" onclick="deleteSite('${s.id}')">×</button></div></div>`).join(''):'<div class="empty">Aucun chantier enregistré.</div>'}</div></main>`}
async function addSite(){const n=document.getElementById('sn').value.trim();if(!n)return;if(sites.some(s=>s.nom.toLowerCase()===n.toLowerCase())){toast('Ce chantier existe déjà');return}const q=await sb.from('chantiers').insert({nom:n,created_by:session.user.id}).select().single();if(q.error)toast('Erreur : '+q.error.message);else{await loadData();renderSites();toast('Chantier ajouté')}}
async function deleteSite(id){if(!confirm('Désactiver ce chantier ? Les anciennes lignes resteront conservées.'))return;const q=await sb.from('chantiers').update({actif:false}).eq('id',id);if(q.error)toast('Erreur : '+q.error.message);else{await loadData();renderSites()}}
async function renameSite(id){const site=sites.find(s=>s.id===id);if(!site)return;const n=prompt('Nouveau nom du chantier :',site.nom);if(n===null)return;const name=n.trim();if(!name)return;if(sites.some(s=>s.id!==id&&s.nom.toLowerCase()===name.toLowerCase())){toast('Ce chantier existe déjà');return}const q=await sb.from('chantiers').update({nom:name}).eq('id',id);if(q.error){toast('Erreur : '+q.error.message);return}await loadData();renderSites();toast('Chantier renommé') }

async function callAdminUsers(payload){
  const {data:{session:s}}=await sb.auth.getSession();
  if(!s?.access_token) throw new Error('Session expirée.');
  const res=await fetch(SUPABASE_URL+'/functions/v1/admin-users',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify(payload)});
  let data=null;try{data=await res.json()}catch{}
  if(!res.ok) throw new Error(data?.error||'Erreur serveur');
  return data;
}
async function renderUsers(){
  if(!isAdmin){show('today');return}
  document.getElementById('app').innerHTML=nav()+`<main><div class="card"><h2>👥 Gestion des utilisateurs</h2><div class="muted">Seuls les administrateurs peuvent créer, supprimer ou modifier les droits.</div></div><div class="card"><h2>Ajouter un utilisateur</h2><div class="grid2"><div><label>Prénom</label><input id="newNom" placeholder="Pierre"></div><div><label>Identifiant</label><input id="newIdent" placeholder="pierre" autocomplete="off"></div></div><div style="margin-top:9px"><label>Mot de passe</label><input id="newPass" type="password" placeholder="Mot de passe"></div><div style="margin-top:9px"><label>Droits</label><select id="newRole"><option value="user">Utilisateur</option><option value="admin">Administrateur</option></select></div><button class="btn" style="margin-top:12px" onclick="createUser()">＋ Créer l'utilisateur</button></div><div class="card"><h2>Utilisateurs existants</h2><div id="usersList" class="spinner">Chargement…</div></div></main>`;
  try{const r=await callAdminUsers({action:'list'});const list=r.users||[];document.getElementById('usersList').innerHTML=list.length?list.map(u=>`<div class="item"><div><div class="big">${esc(u.nom||'Sans prénom')} ${u.role==='admin'?'<span class="badge">Administrateur</span>':'<span class="badge">Utilisateur</span>'}</div><div class="muted">${esc(u.identifiant||'')} · ${u.id===session.user.id?'Compte actuel':''}</div></div><div class="actions">${u.id===session.user.id ? '' : `<button class="btn light" onclick="changeUserRole('${u.id}','${u.role==='admin'?'user':'admin'}')">${u.role==='admin'?'Retirer les droits admin':'Donner les droits admin'}</button><button class="btn red" onclick="deleteUser('${u.id}','${esc(u.nom||u.identifiant||'cet utilisateur')}')">Supprimer</button>`}</div></div>`).join(''):'<div class="empty">Aucun utilisateur.</div>'}catch(e){document.getElementById('usersList').innerHTML='<div class="danger-note">'+esc(e.message)+'</div>'}
}
async function createUser(){const nom=document.getElementById('newNom').value.trim(),ident=document.getElementById('newIdent').value.trim().toLowerCase().replace(/\s+/g,''),password=document.getElementById('newPass').value,role=document.getElementById('newRole').value;if(!nom||!ident||!password){toast('Renseigne le prénom, l’identifiant et le mot de passe.');return}if(ident.includes('@')){toast('L’identifiant doit être un prénom ou un identifiant simple, sans @.');return}if(password.length<6){toast('Le mot de passe doit comporter au moins 6 caractères.');return}try{await callAdminUsers({action:'create',nom,identifiant:ident,password,role});toast('Utilisateur créé');renderUsers()}catch(e){toast('Création impossible : '+e.message)}}
async function changeUserRole(id,role){if(id===session.user.id&&role==='user'&&!confirm('Retirer tes propres droits administrateur ? Tu ne pourras plus gérer les utilisateurs.'))return;if(!confirm(role==='admin'?'Donner les droits administrateur à cet utilisateur ?':'Retirer les droits administrateur de cet utilisateur ?'))return;try{await callAdminUsers({action:'set_role',id,role});toast('Droits mis à jour');renderUsers()}catch(e){toast('Modification impossible : '+e.message)}}
async function deleteUser(id,name){if(id===session.user.id){toast('Tu ne peux pas supprimer ton propre compte ici.');return}if(!confirm('Supprimer définitivement '+name+' ? Ses journées resteront conservées mais son compte ne pourra plus se connecter.'))return;try{await callAdminUsers({action:'delete',id});toast('Utilisateur supprimé');renderUsers()}catch(e){toast('Suppression impossible : '+e.message)}}

function exportData(){const backup={app:'Suivi Chantier',version:5,exportedAt:new Date().toISOString(),data:{days,rates,sites}};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='suivi-chantier-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Sauvegarde exportée')}
function importData(input){const f=input.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=e=>{try{const p=JSON.parse(e.target.result),d=p.data||p;if(!d||!d.days)throw 0;localStorage.setItem(LOCAL_KEY,JSON.stringify({days:d.days,rates:d.rates||[],sites:d.sites||[]}));toast('Sauvegarde locale conservée sur ce PC. Pour la mettre en ligne, utilise la migration ci-dessous.')}catch{alert('Fichier invalide.')}finally{input.value=''}};reader.readAsText(f)}
async function migrateOldData(input){const f=input.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text()),d=p.data||p;if(!d?.days)throw new Error('Format invalide');if(!confirm('Importer cet ancien historique dans Supabase ? Ne lance cette opération qu’une seule fois.'))return;toast('Migration en cours…');let siteMap=new Map(sites.map(s=>[s.nom.toLowerCase(),s.id]));for(const name of d.sites||[]){if(siteMap.has(String(name).toLowerCase()))continue;const q=await sb.from('chantiers').insert({nom:String(name),created_by:session.user.id}).select().single();if(q.data){siteMap.set(String(name).toLowerCase(),q.data.id)}}let rateMap=new Map(rates.map(r=>[r.name.toLowerCase(),r.id]));for(const r of d.rates||[]){if(rateMap.has(String(r.name).toLowerCase()))continue;const q=await sb.from('taches').insert({nom:r.name,unite:r.unit||'u',prix:Number(r.price)||0,created_by:session.user.id}).select().single();if(q.data)rateMap.set(String(r.name).toLowerCase(),q.data.id)}await loadData();siteMap=new Map(sites.map(s=>[s.nom.toLowerCase(),s.id]));rateMap=new Map(rates.map(r=>[r.nom.toLowerCase(),r.id]));let count=0;for(const [date,oldDay] of Object.entries(d.days||{})){const existing=days[date];if(existing)continue;const q=await sb.from('jours').insert({date_travail:date,user_id:session.user.id}).select().single();if(q.error||!q.data)continue;const payload=(oldDay.lines||[]).filter(l=>l.site||l.name||Number(l.qty)||Number(l.price)).map(l=>({jour_id:q.data.id,chantier_id:siteMap.get(String(l.site||'').toLowerCase()),tache_id:rateMap.get(String(l.name||'').toLowerCase())||null,tache_nom:l.name||'Tâche libre',unite:l.unit||'u',quantite:Number(l.qty)||0,prix_unitaire:Number(l.price)||0,remarque:(l.remarque||'').trim()||null,user_id:session.user.id})).filter(x=>x.chantier_id);if(payload.length){await sb.from('travaux').insert(payload);count++}}await loadData();toast('Migration terminée : '+count+' journée(s) importée(s)');render()}catch(e){console.error(e);alert('Migration impossible : '+e.message)}finally{input.value=''}}

function allRecords(){const out=[];Object.entries(days).forEach(([date,day])=>day.lines.forEach((l,idx)=>out.push({...l,date,lineIndex:idx,dayTotal:day.total,user_id:day.user_id})));return out}
function renderSearch(){const years=[...new Set(Object.keys(days).map(d=>d.slice(0,4)))].sort().reverse(),currentYear=years[0]||String(new Date().getFullYear()),yearOptions=years.map(y=>`<option value="${y}">${y}</option>`).join(''),siteOptions=sites.map(s=>`<option value="${esc(s.nom)}">${esc(s.nom)}</option>`).join(''),taskOptions=rates.map(r=>`<option value="${esc(r.nom)}">${esc(r.nom)}</option>`).join('');document.getElementById('app').innerHTML=nav()+`<main><div class="card"><h2>🔎 Rechercher des travaux</h2>${isAdmin?'<div class="muted" style="margin-bottom:10px">En administrateur, tu vois les travaux de tous les utilisateurs.</div>':''}<div class="grid2"><div><label>Date exacte</label><input id="qDate" type="date"></div><div><label>Chantier</label><select id="qSite"><option value="">Tous les chantiers</option>${siteOptions}</select></div></div><div class="grid2" style="margin-top:9px"><div><label>Date de début</label><input id="qFrom" type="date"></div><div><label>Date de fin</label><input id="qTo" type="date"></div></div><div style="margin-top:9px"><label>Tâche</label><select id="qTask"><option value="">Toutes les tâches</option>${taskOptions}</select></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="runSearch()">Rechercher</button><button class="btn light" onclick="clearSearch()">Réinitialiser</button></div></div><div id="searchResults"></div><div class="card"><h2>📊 Total annuel par tâche</h2><div class="grid2"><div><label>Année</label><select id="statYear">${yearOptions||`<option>${currentYear}</option>`}</select></div><div><label>Tâche</label><select id="statTask"><option value="">Toutes les tâches</option>${taskOptions}</select></div></div><div style="margin-top:10px"><label>Chantier</label><select id="statSite"><option value="">Tous les chantiers</option>${siteOptions}</select></div><button class="btn" style="margin-top:12px" onclick="runStats()">Calculer</button><div id="statsResults" style="margin-top:12px"></div></div></main>`}
function runSearch(){
 const exact=document.getElementById('qDate')?.value||'',from=document.getElementById('qFrom')?.value||'',to=document.getElementById('qTo')?.value||'',site=document.getElementById('qSite')?.value||'',task=document.getElementById('qTask')?.value||'';
 let rows=allRecords().filter(r=>(!exact||r.date===exact)&&(!from||r.date>=from)&&(!to||r.date<=to)&&(!site||r.site===site)&&(!task||r.name===task));
 rows.sort((a,b)=>b.date.localeCompare(a.date));
 const total=rows.reduce((s,r)=>s+r.qty*r.price,0),box=document.getElementById('searchResults');if(!box)return;
 box.innerHTML=`<div class="card"><h2>Résultats</h2><div class="statgrid"><div class="stat"><div class="muted">Lignes trouvées</div><div class="value">${rows.length}</div></div>${isAdmin?`<div class="stat"><div class="muted">Montant total</div><div class="value">${money(total)}</div></div>`:''}</div>${rows.length?rows.map(r=>`<div class="item"><div onclick="editDay('${r.date}')" style="cursor:pointer"><div class="big">${esc(r.name||'Tâche libre')}</div><div class="muted">${dateFR(r.date)} · 🏗️ ${esc(r.site||'Sans chantier')}</div><div class="muted">${r.qty} ${esc(r.unit||'')}${isAdmin?' × '+money(r.price):''}</div></div>${isAdmin?`<div class="money">${money(r.qty*r.price)}</div>`:''}</div>`).join(''):'<div class="empty">Aucun résultat.</div>'}</div>`
}
function runStats(){
 const year=document.getElementById('statYear')?.value||String(new Date().getFullYear());
 const task=document.getElementById('statTask')?.value||'';
 const site=document.getElementById('statSite')?.value||'';
 const rows=allRecords().filter(r=>r.date.startsWith(year)&&(!task||r.name===task)&&(!site||r.site===site));
 const groups={};
 rows.forEach(r=>{
   const key=r.name||'Tâche libre';
   if(!groups[key])groups[key]={qty:0,total:0,days:new Set(),byMonth:{}};
   groups[key].qty+=r.qty;
   groups[key].total+=r.qty*r.price;
   groups[key].days.add(r.date);
   const m=r.date.slice(0,7);
   groups[key].byMonth[m]=(groups[key].byMonth[m]||0)+r.qty*r.price;
 });
 const grandQty=rows.reduce((s,r)=>s+r.qty,0);
 const grandTotal=rows.reduce((s,r)=>s+r.qty*r.price,0);
 const box=document.getElementById('statsResults');
 if(!box)return;
 const names=Object.keys(groups).sort();
 if(!names.length){box.innerHTML='<div class="empty">Aucune donnée pour cette sélection.</div>';return}
 let html='<div class="statgrid"><div class="stat"><div class="muted">Quantité totale</div><div class="value">'+grandQty.toLocaleString('fr-FR')+'</div></div>';
 if(isAdmin)html+='<div class="stat"><div class="muted">Montant total</div><div class="value">'+money(grandTotal)+'</div></div>';
 html+='</div>';
 names.forEach(n=>{
   html+='<div class="item"><div><div class="big">'+esc(n)+'</div><div class="muted">'+groups[n].qty.toLocaleString('fr-FR')+' unité(s) · '+groups[n].days.size+' jour(s)</div></div>';
   if(isAdmin)html+='<div class="money">'+money(groups[n].total)+'</div>';
   html+='</div>';
 });
 html+='<div style="margin-top:10px"><h3>Détail mensuel</h3>';
 Object.entries(groups).forEach(([n,g])=>{
   html+='<div style="margin-bottom:12px"><div class="big">'+esc(n)+'</div>';
   Object.keys(g.byMonth).sort().forEach(m=>{
     html+='<div class="site-total"><span>'+monthFR(m)+'</span>';
     if(isAdmin)html+='<span>'+money(g.byMonth[m])+'</span>';
     html+='</div>';
   });
   html+='</div>';
 });
 html+='</div>';
 box.innerHTML=html;
}
init();
</script>
